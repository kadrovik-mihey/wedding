<style>
@font-face{font-family:'Invitation Script';src:url(assets/fonts/font-01.woff2) format('woff2');font-style:normal;font-weight:400;font-display:swap}
:root{--paper:#f8f4ed;--green:#737e68;--deep:#596453;--ink:#343832;--sand:#d9cdb9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:400 14px/1.6 Montserrat,Arial,sans-serif}
.page{max-width:960px;min-height:100vh;margin:0 auto;padding:30px clamp(20px,5vw,54px) 46px;background:var(--paper)}
.back{display:inline-block;color:var(--deep);font-size:12px;text-decoration:none;border-bottom:1px solid #59645366;padding-bottom:2px}
.back:hover{color:var(--ink)}
header{text-align:center;margin:24px 0 34px}
h1{margin:0;color:var(--ink);font:400 clamp(36px,6vw,52px)/1.1 'Invitation Script',cursive}
.lead{margin:30px 0 0;color:#74796f;font-size:13px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
figure{min-width:0;margin:0}
.photo-placeholder{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;padding:16px;border:1px solid #d9cdb9;border-radius:6px;background:linear-gradient(145deg,#eee9df,#e5e1d8);color:#74796f;text-align:center}
.photo-placeholder span{font-size:12px;letter-spacing:.02em}
figcaption{margin-top:9px;color:#596453;font-size:12px;text-align:center}
.bottom{text-align:center;margin-top:34px}
@media(max-width:700px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.page{padding-top:22px}header{margin:22px 0 26px}}
@media(max-width:360px){.gallery{gap:10px}.photo-placeholder span{font-size:11px}}
.look-frame{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #d9cdb9;border-radius:6px;background:linear-gradient(145deg,#eee9df,#e5e1d8)}.look-photo{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.look-white .look-frame{background:#fff}.look-white .look-photo{object-fit:contain}.look-color .look-frame{background:linear-gradient(90deg,#737e68 0 50%,#8f7869 50% 100%)}.look-color .look-photo{object-fit:contain}.look-light .look-frame{background:#f1f0ed}.look-light .look-photo{object-fit:contain}.look-gray .look-frame{background:#e4e3e1}.look-gray .look-photo{object-fit:contain}</style>
</head>
